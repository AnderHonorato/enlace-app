name: Preview standalone

on:
  push:
    branches: [feat/100-melhorias-enlace]
    paths:
      - .github/workflows/preview-standalone.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./preview.db
      APP_SECRET: preview-local-enlace-preview-local-enlace
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar banco de demonstração
        run: |
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Ativar build standalone apenas para a prévia
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('next.config.mjs')
          text = p.read_text()
          marker = 'const nextConfig = {\n'
          if 'output: "standalone"' not in text:
              text = text.replace(marker, marker + '  output: "standalone",\n', 1)
          p.write_text(text)
          PY

      - name: Compilar prévia
        run: npm run build

      - name: Montar pacote executável
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
          mkdir -p .next/standalone/prisma
          cp prisma/preview.db .next/standalone/prisma/preview.db

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: enlace-preview-standalone
          path: .next/standalone
          include-hidden-files: true
          retention-days: 1
          compression-level: 6

      - name: Instalar navegador de captura
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core

      - name: Subir prévia para capturas
        run: |
          cd .next/standalone
          DATABASE_URL="file:$PWD/prisma/preview.db" \
          APP_SECRET="preview-local-enlace-preview-local-enlace" \
          HOSTNAME=127.0.0.1 PORT=3000 node server.js >/tmp/enlace-preview.log 2>&1 &
          echo $! >/tmp/enlace-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/demo >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enlace-preview.log
          exit 1

      - name: Capturar desktop e celular
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          cat >capturar-preview.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const base = 'http://127.0.0.1:3000';

          async function autenticar(context) {
            const resposta = await context.request.post(base + '/api/auth/login', {
              data: { email: 'ana@enlace.app', password: 'enlace123' }
            });
            if (!resposta.ok()) throw new Error('Login demo falhou: ' + resposta.status());
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });

            const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            let page = await desktop.newPage();
            await page.goto(base + '/demo', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1200);
            await page.screenshot({ path: 'preview-demo-desktop.png' });
            await page.goto(base + '/entrar', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(800);
            await page.screenshot({ path: 'preview-login-desktop.png' });
            await autenticar(desktop);
            await page.goto(base + '/app', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(3500);
            await page.screenshot({ path: 'preview-app-desktop.png' });
            await desktop.close();

            const mobile = await browser.newContext({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              deviceScaleFactor: 1
            });
            await autenticar(mobile);
            page = await mobile.newPage();
            await page.goto(base + '/app', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(3500);
            await page.screenshot({ path: 'preview-app-mobile.png' });
            await mobile.close();
            await browser.close();
          })().catch((erro) => { console.error(erro); process.exit(1); });
          JS
          node capturar-preview.cjs

      - name: Publicar screenshots
        uses: actions/upload-artifact@v4
        with:
          name: enlace-preview-screenshots
          path: |
            preview-demo-desktop.png
            preview-login-desktop.png
            preview-app-desktop.png
            preview-app-mobile.png
          retention-days: 1
