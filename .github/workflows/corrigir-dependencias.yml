name: Corrigir dependências vulneráveis

on:
  push:
    branches: [feat/100-melhorias-enlace]
    paths:
      - .github/workflows/corrigir-dependencias.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: file:./prisma/deps-ci.db
  APP_SECRET: enlace-ci-enlace-ci-enlace-ci-enlace-ci

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
        with:
          ref: feat/100-melhorias-enlace

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar estado atual
        run: npm ci

      - name: Remover dependência ngrok não utilizada
        run: npm uninstall ngrok --save-dev

      - name: Atualizar PostCSS direto
        run: npm install --save-dev postcss@^8.5.23

      - name: Corrigir transitivos vulneráveis do Next sem trocar de major
        run: |
          npm pkg set "overrides.next.postcss=^8.5.23"
          npm pkg set "overrides.next.nanoid=^3.3.18"
          npm install --package-lock-only

      - name: Reinstalar exatamente pelo lockfile atualizado
        run: |
          rm -rf node_modules
          npm ci

      - name: Exigir auditoria limpa em produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Exigir auditoria limpa completa
        run: npm audit --audit-level=moderate

      - name: Validar Prisma
        run: npx prisma validate

      - name: Verificar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Executar testes
        run: npm run test

      - name: Verificar arquitetura
        run: npm run arquitetura:verificar

      - name: Compilar aplicação
        run: npm run build

      - name: Registrar apenas se tudo estiver verde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "seguranca: remover dependencias vulneraveis"
          git push origin HEAD:feat/100-melhorias-enlace
