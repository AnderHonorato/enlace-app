name: Migrar com segurança para Next 16

on:
  push:
    branches: [feat/100-melhorias-enlace]
    paths:
      - .github/workflows/corrigir-dependencias.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: file:./prisma/next16-ci.db
  APP_SECRET: enlace-ci-next16-validacao-segura

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
        with:
          ref: feat/100-melhorias-enlace

      - name: Preparar Node compatível
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm

      - name: Instalar estado atual
        run: npm ci

      - name: Remover dependência ngrok não utilizada
        run: npm uninstall ngrok --save-dev

      - name: Migrar Next e React
        run: npm install next@16.3.3 react@19.2.0 react-dom@19.2.0

      - name: Atualizar ferramentas compatíveis
        run: npm install --save-dev eslint@^9 eslint-config-next@16.3.3 @types/react@^19 @types/react-dom@^19 postcss@^8.5.23

      - name: Migrar ESLint para Flat Config
        run: |
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";

          export default defineConfig([
            ...nextVitals,
            {
              rules: {
                "react/no-unescaped-entities": "off",
              },
            },
            globalIgnores([
              ".next/**",
              ".next-build/**",
              ".next-preview/**",
              "out/**",
              "build/**",
              "next-env.d.ts",
            ]),
          ]);
          EOF
          rm -f .eslintrc.json
          npm pkg set "scripts.lint=eslint src"

      - name: Reinstalar exatamente pelo lockfile atualizado
        run: |
          rm -rf node_modules
          npm ci

      - name: Confirmar versões migradas
        run: |
          node -e "const p=require('./package.json'); console.log({next:p.dependencies.next,react:p.dependencies.react,reactDom:p.dependencies['react-dom'],eslint:p.devDependencies.eslint,eslintNext:p.devDependencies['eslint-config-next']})"

      - name: Exigir auditoria limpa em produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Exigir auditoria limpa completa
        run: npm audit --audit-level=moderate

      - name: Validar Prisma
        run: npx prisma validate

      - name: Verificar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Executar testes
        run: npm run test

      - name: Verificar arquitetura
        run: npm run arquitetura:verificar

      - name: Compilar aplicação com Next 16
        run: npm run build

      - name: Registrar apenas se tudo estiver verde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs .eslintrc.json
          git diff --cached --quiet && exit 0
          git commit -m "seguranca: migrar para Next 16 e zerar vulnerabilidades"
          git push origin HEAD:feat/100-melhorias-enlace
