name: Atualizar dependências críticas

on:
  push:
    branches: [feat/100-melhorias-enlace]
    paths:
      - .github/workflows/atualizar-dependencias.yml

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: feat/100-melhorias-enlace

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar base
        run: npm ci

      - name: Atualizar Next e ESLint
        run: |
          npm install --save-exact next@15.5.24
          npm install --save-dev --save-exact eslint@8.57.1 eslint-config-next@15.5.24

      - name: Registrar lockfile atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "segurança: atualizar Next e configurar ESLint"
          git push origin HEAD:feat/100-melhorias-enlace
