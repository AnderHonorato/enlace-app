name: Aplicar evolução aditiva do schema

on:
  push:
    branches: [feat/100-melhorias-enlace]
    paths:
      - .github/workflows/aplicar-evolucao-schema.yml

permissions:
  contents: write

env:
  DATABASE_URL: file:./prisma/schema-evolution-ci.db

jobs:
  evoluir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: feat/100-melhorias-enlace

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Evoluir schema sem remover dados
        run: python3 scripts/evoluir-schema-auditoria.py

      - name: Formatar e validar schema
        run: |
          npx prisma format --schema prisma/schema.prisma
          npx prisma validate --schema prisma/schema.prisma

      - name: Registrar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git diff --cached --quiet && exit 0
          git commit -m "dados: adicionar sessões revogáveis e mídia privada"
          git push origin HEAD:feat/100-melhorias-enlace
