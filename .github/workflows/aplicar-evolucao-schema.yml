name: Aplicar evolução aditiva do schema

on:
  push:
    branches: [feat/100-melhorias-enlace]
    paths:
      - .github/workflows/aplicar-evolucao-schema.yml

permissions:
  contents: write

jobs:
  evoluir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: feat/100-melhorias-enlace

      - name: Evoluir schema sem remover dados
        shell: python
        run: |
          from pathlib import Path
          p = Path('prisma/schema.prisma')
          s = p.read_text(encoding='utf-8')

          if 'authSessions AuthSession[]' not in s:
              s = s.replace('  tasks        TaskItem[]\n', '  tasks        TaskItem[]\n  authSessions AuthSession[]\n')

          old_upload = '''model ChatUpload {
  id         String   @id @default(cuid())
  coupleId   String
  uploaderId String
  name       String
  mime       String
  size       Int
  data       Bytes
  createdAt  DateTime @default(now())

  @@index([coupleId, createdAt])
}'''
          new_upload = '''model ChatUpload {
  id              String   @id @default(cuid())
  coupleId        String
  uploaderId      String
  name            String
  mime            String
  size            Int
  data            Bytes?
  storageProvider String   @default("database") // database | supabase
  storageKey      String?
  category        String   @default("chat") // chat | avatar | album | memorias
  createdAt       DateTime @default(now())

  @@index([coupleId, createdAt])
  @@index([coupleId, category, createdAt])
  @@index([uploaderId, createdAt])
}'''
          if old_upload in s:
              s = s.replace(old_upload, new_upload)
          elif 'storageProvider String' not in s:
              raise SystemExit('Bloco ChatUpload inesperado; abortando para não corromper o schema.')

          if 'model AuthSession {' not in s:
              s += '''\n\n/// Sessão revogável por dispositivo. Permite sair de todos os aparelhos e\n/// encerrar sessões inativas sem depender apenas da expiração do JWT.\nmodel AuthSession {\n  id         String    @id @default(cuid())\n  userId     String\n  user       User      @relation(fields: [userId], references: [id], onDelete: Cascade)\n  createdAt  DateTime  @default(now())\n  lastSeenAt DateTime  @default(now())\n  expiresAt  DateTime\n  revokedAt  DateTime?\n\n  @@index([userId, revokedAt])\n  @@index([expiresAt])\n}\n'''

          p.write_text(s, encoding='utf-8')

      - name: Validar schema
        run: npx prisma format --schema prisma/schema.prisma

      - name: Registrar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git diff --cached --quiet && exit 0
          git commit -m "dados: adicionar sessões revogáveis e mídia privada"
          git push origin HEAD:feat/100-melhorias-enlace
